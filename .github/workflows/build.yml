name: Build debug client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh -DebugBuild

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: client-debug-swf
          path: |
            client.swf
            assets/theme/swmmo-theme.swf
            compile.log
          if-no-files-found: error